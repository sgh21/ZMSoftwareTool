name: Linux build for Kylin V10 x86_64

on:
  workflow_dispatch:
  push:
    branches: [codex/release-windows-kylin-v10]
    paths:
      - 'main.py'
      - 'app/**'
      - 'core/**'
      - 'config/**'
      - 'resources/**'
      - 'tests/**'
      - 'tools/release/**'
      - '.github/workflows/build-kylin-v10.yml'

permissions:
  contents: read

concurrency:
  group: kylin-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64:2026.10.10-1
    env:
      PYTHON: /opt/softwaretools-python/bin/python3.12
      LD_LIBRARY_PATH: /opt/softwaretools-python/lib
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
      SHARED_PYTHON_CACHE_KEY: manylinux_2_28-2026.10.10-1-x86_64-cpython-3.12.15-shared-system-openssl-v1
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt X11 and external startup-check dependencies
        shell: bash
        run: |
          # The pinned image may contain repository metadata whose mirror files expired.
          dnf clean all
          dnf install -y epel-release
          dnf install -y \
            libX11 libXext libXrender libXfixes libXi libXcursor libXrandr \
            libSM libICE libxcb libxkbcommon libxkbcommon-x11 \
            xcb-util xcb-util-image xcb-util-keysyms xcb-util-renderutil \
            xcb-util-wm xcb-util-cursor mesa-libGL mesa-libEGL \
            fontconfig freetype dejavu-sans-fonts dbus-libs \
            xorg-x11-server-Xvfb xorg-x11-utils xorg-x11-xauth \
            bzip2-devel libffi-devel xz-devel zlib-devel openssl-devel \
            readline-devel sqlite-devel ncurses-devel libuuid-devel
      - name: Restore shared CPython build
        id: shared-python-cache
        uses: actions/cache/restore@v4
        with:
          path: /opt/softwaretools-python
          key: ${{ env.SHARED_PYTHON_CACHE_KEY }}
      - name: Build shared CPython required by PyInstaller
        if: steps.shared-python-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash tools/release/build_shared_python.sh
      - name: Cache shared CPython before application checks
        if: steps.shared-python-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /opt/softwaretools-python
          key: ${{ env.SHARED_PYTHON_CACHE_KEY }}
      - name: Record shared CPython build configuration
        shell: bash
        run: |
          mkdir -p dist/linux-build-report
          cp /opt/softwaretools-python/build-configuration.txt dist/linux-build-report/cpython-build-configuration.txt
      - name: Build and check actual Linux executable
        shell: bash
        run: bash tools/release/build_kylin.sh
      - name: Upload software archive and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SoftwareTools-linux-x86_64-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            dist/SoftwareTools-linux-x86_64.tar.gz
            dist/linux-build-report/
